<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>书目一览 · 半亩方塘</title>
<meta name="description" content="半亩方塘阅读札记的书目一览。">
<link rel="canonical" href="https://dqquan.com/books/all/">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32.png">
<style>
:root{--paper:#f7f4ed;--ink:#201f1b;--ink-2:#5f5b53;--ink-3:#6f685f;--line:#d7d0c2;--seal:#9b3227}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","Noto Serif SC","STSong",serif;line-height:1.9}
.wrap{width:min(calc(100% - 72px),920px);margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:28px 0 18px;border-bottom:1px solid var(--line)}
header a{text-decoration:none}
header .mark{display:inline-flex;align-items:center;min-height:44px;color:var(--seal);font-size:21px;letter-spacing:.34em}
header nav{display:flex;gap:26px;font-size:12px;letter-spacing:.16em}
header nav a{display:inline-flex;align-items:center;min-height:44px;color:var(--ink-2)}
header nav a[aria-current="page"]{color:var(--ink)}
main{padding:66px 0 80px}
.kicker{margin:0 0 12px;color:var(--ink-3);font-size:11px;letter-spacing:.18em}
h1{margin:0 0 18px;font-size:clamp(34px,6vw,58px);font-weight:500;line-height:1.25}
.lede{max-width:34em;margin:0 0 42px;color:var(--ink-2);font-size:15px}
.book-index{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.book-index li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:16px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line)}
.book-index a{display:contents;color:inherit;text-decoration:none}
.book-index a:hover strong{color:var(--seal)}
.book-index .no{color:var(--ink-3);font-size:10px;letter-spacing:.12em}
.book-index strong{font-size:16px;font-weight:500}
.book-index small{color:var(--ink-3);font-size:11px}
footer{padding:24px 0 64px;border-top:1px solid var(--line);color:var(--ink-3);font-size:12px}
footer a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--seal);outline-offset:4px}
@media (max-width:640px){
  .wrap{width:calc(100% - 40px)}
  header nav{gap:10px}
  main{padding-top:48px}
  .book-index li{grid-template-columns:38px 1fr;gap:10px}
  .book-index small{grid-column:2}
}
</style>
</head>
<body>
<header class="wrap">
  <a class="mark" href="../../index.html">半亩方塘</a>
  <nav aria-label="主导航">
    <a href="../index.html" aria-current="page">阅读</a>
    <a href="../../photos/index.html">足迹</a>
    <a href="../../about/index.html">关于</a>
  </nav>
</header>
<main id="main" class="wrap">
  <p class="kicker">阅读札记 · {{COUNT}} 期</p>
  <h1>书目一览</h1>
  <p class="lede">先保留一条可用的总目录路由；分组、筛读与排序结构待小六给出方案后定稿。</p>
  <ol class="book-index">
{{BOOK_LIST}}
  </ol>
</main>
<footer class="wrap">
  <a href="../index.html">← 返回阅读目录</a>
</footer>
</body>
</html>
